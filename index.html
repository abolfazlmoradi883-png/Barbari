<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سامانه جامع مالی و پرداخت باربری</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { font-family: 'Vazirmatn', sans-serif; }
        body { background-color: #f1f5f9; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // آیکون‌های گرافیکی SVG
        const Icons = {
            Truck: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 17a2 2 0 11-4 0 2 2 0 014 0zm10 0a2 2 0 11-4 0 2 2 0 014 0zM13 17H8m10 0h2v-4l-3-5h-4v9zm0 0H8M3 17h1m-1-4h10V6H3v7z"/></svg>,
            User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
            UserPlus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>,
            Lock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>,
            Calculator: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>,
            Upload: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
            Logout: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>,
            Key: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>,
            Image: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        };

        const STATUS_CONFIG = {
            'در انتظار بررسی': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', dot: 'bg-amber-500' },
            'در حال پرداخت': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', dot: 'bg-blue-500' },
            'پرداخت شده': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', dot: 'bg-emerald-500' },
            'رد شده': { bg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200', dot: 'bg-rose-500' }
        };

        function App() {
            // وضعیت احراز هویت و کاربران
            const [currentUser, setCurrentUser] = useState(null);
            const [authTab, setAuthTab] = useState('emp_login'); // 'emp_login' | 'emp_register' | 'acc_login'
            const [authError, setAuthError] = useState('');

            // لیست کارمندان ثبت‌نام شده و رمز حسابداری
            const [employees, setEmployees] = useState([]);
            const [accPassword, setAccPassword] = useState('123456');

            // فیلدهای ورود و ثبت‌نام
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [regName, setRegName] = useState('');
            const [regNationalCode, setRegNationalCode] = useState('');
            const [regJobTitle, setRegJobTitle] = useState('');
            const [regUsername, setRegUsername] = useState('');
            const [regPassword, setRegPassword] = useState('');
            const [accPassInput, setAccPassInput] = useState('');

            // مودال تغییر رمز حسابداری
            const [showPassModal, setShowPassModal] = useState(false);
            const [newAccPass, setNewAccPass] = useState('');

            // استیت‌های درخواست‌ها
            const [requests, setRequests] = useState([]);
            const [filterStatus, setFilterStatus] = useState('همه');
            const [previewModalImg, setPreviewModalImg] = useState(null);

            // استیت‌های فرم کارمند
            const [amount, setAmount] = useState('');
            const [title, setTitle] = useState('');
            const [sheba, setSheba] = useState('');
            const [description, setDescription] = useState('');

            // استیت‌های فرم حسابداری
            const [selectedReq, setSelectedReq] = useState(null);
            const [accStatus, setAccStatus] = useState('در حال پرداخت');
            const [trackingCode, setTrackingCode] = useState('');
            const [accNote, setAccNote] = useState('');
            const [receiptImg, setReceiptImg] = useState(null);
            const [uploading, setUploading] = useState(false);

            // بارگذاری اولیه از حافظه مرورگر
            useEffect(() => {
                // ۱. بارگذاری کارمندان
                const savedUsers = localStorage.getItem('barbari_users_v4');
                if (savedUsers) {
                    setEmployees(JSON.parse(savedUsers));
                } else {
                    const defaultUsers = [
                        { id: 'emp1', name: 'علی رضایی', nationalCode: '0012345678', jobTitle: 'ترخیص و بارنامه', username: 'ali', password: '123' },
                        { id: 'emp2', name: 'محمد حسینی', nationalCode: '0098765432', jobTitle: 'امور رانندگان', username: 'mohammad', password: '123' }
                    ];
                    setEmployees(defaultUsers);
                    localStorage.setItem('barbari_users_v4', JSON.stringify(defaultUsers));
                }

                // ۲. بارگذاری رمز حسابداری
                const savedAccPass = localStorage.getItem('barbari_acc_pass_v4');
                if (savedAccPass) {
                    setAccPassword(savedAccPass);
                } else {
                    localStorage.setItem('barbari_acc_pass_v4', '123456');
                }

                // ۳. بارگذاری درخواست‌ها
                const savedReqs = localStorage.getItem('barbari_requests_v4');
                if (savedReqs) {
                    setRequests(JSON.parse(savedReqs));
                } else {
                    const demoData = [
                        {
                            id: 1710001,
                            empId: 'emp1',
                            empName: 'علی رضایی (ترخیص و بارنامه)',
                            empNationalCode: '0012345678',
                            title: 'بیعانه کرایه تریلی کفی - بار تهران به بندرعباس',
                            amount: 18500000,
                            sheba: '6037-9975-9912-3456',
                            description: 'راننده آقای کریمی، پلاک ۴۴ع۷۸۹ ایران ۱۰ - نیازمند واریز فوری جهت حرکت',
                            status: 'پرداخت شده',
                            date: '۱۴۰۵/۰۸/۱۷ - ۱۰:۳۰',
                            trackingCode: '۸۸۴۹۲۰۱۱۲۴',
                            accNote: 'از حساب ملت باربری واریز شد.',
                            receiptImage: null
                        }
                    ];
                    setRequests(demoData);
                    localStorage.setItem('barbari_requests_v4', JSON.stringify(demoData));
                }
            }, []);

            // ذخیره تغییرات درخواست‌ها
            useEffect(() => {
                if (requests.length > 0) {
                    localStorage.setItem('barbari_requests_v4', JSON.stringify(requests));
                }
            }, [requests]);

            const formatNumber = (num) => Number(num).toLocaleString('fa-IR');

            // عملکرد ورود کارمند (امکان ورود با نام کاربری یا کد ملی)
            const handleEmployeeLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                const cleanInput = loginUsername.trim().toLowerCase();
                const found = employees.find(u => 
                    (u.username.toLowerCase() === cleanInput || u.nationalCode === cleanInput) && 
                    u.password === loginPassword
                );
                if (!found) {
                    setAuthError('نام کاربری/کد ملی یا رمز عبور اشتباه است.');
                    return;
                }
                setCurrentUser({ role: 'employee', ...found });
                setLoginUsername('');
                setLoginPassword('');
            };

            // عملکرد ثبت‌نام کارمند جدید به همراه کد ملی
            const handleEmployeeRegister = (e) => {
                e.preventDefault();
                setAuthError('');
                const cleanUser = regUsername.trim().toLowerCase();
                const cleanNationalCode = regNationalCode.trim();

                if (!regName.trim() || !cleanNationalCode || !cleanUser || !regPassword) {
                    setAuthError('لطفاً تمام فیلدهای ستاره‌دار را تکمیل کنید.');
                    return;
                }
                if (!/^\d{10}$/.test(cleanNationalCode)) {
                    setAuthError('کد ملی باید دقیقاً ۱۰ رقم عددی باشد.');
                    return;
                }
                if (employees.some(u => u.nationalCode === cleanNationalCode)) {
                    setAuthError('این کد ملی قبلاً در سیستم ثبت شده است.');
                    return;
                }
                if (employees.some(u => u.username.toLowerCase() === cleanUser)) {
                    setAuthError('این نام کاربری قبلاً انتخاب شده است.');
                    return;
                }

                const newEmp = {
                    id: 'emp_' + Date.now(),
                    name: regName.trim(),
                    nationalCode: cleanNationalCode,
                    jobTitle: regJobTitle.trim() || 'کارمند باربری',
                    username: cleanUser,
                    password: regPassword
                };

                const updatedUsers = [...employees, newEmp];
                setEmployees(updatedUsers);
                localStorage.setItem('barbari_users_v4', JSON.stringify(updatedUsers));

                // ورود خودکار پس از ثبت‌نام
                setCurrentUser({ role: 'employee', ...newEmp });
                setRegName('');
                setRegNationalCode('');
                setRegJobTitle('');
                setRegUsername('');
                setRegPassword('');
            };

            // عملکرد ورود حسابداری با رمز اختصاصی
            const handleAccountantLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                if (accPassInput !== accPassword) {
                    setAuthError('رمز عبور واحد حسابداری اشتباه است!');
                    return;
                }
                setCurrentUser({ role: 'accountant' });
                setAccPassInput('');
            };

            // تغییر رمز حسابداری
            const handleChangeAccPassword = (e) => {
                e.preventDefault();
                if (!newAccPass || newAccPass.length < 4) {
                    alert('رمز جدید باید حداقل ۴ کاراکتر باشد.');
                    return;
                }
                setAccPassword(newAccPass);
                localStorage.setItem('barbari_acc_pass_v4', newAccPass);
                setNewAccPass('');
                setShowPassModal(false);
                alert('رمز عبور واحد حسابداری با موفقیت تغییر کرد.');
            };

            // آپلود و فشرده‌سازی عکس تا ۱۰ مگابایت
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 10 * 1024 * 1024) {
                    alert('حجم تصویر نباید بیشتر از ۱۰ مگابایت باشد!');
                    return;
                }
                setUploading(true);
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        const scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        setReceiptImg(canvas.toDataURL('image/jpeg', 0.75));
                        setUploading(false);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            // ثبت درخواست کارمند
            const handleCreateRequest = (e) => {
                e.preventDefault();
                if (!amount || !title) return;
                const now = new Date();
                const dateStr = now.toLocaleDateString('fa-IR') + ' - ' + now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

                const newItem = {
                    id: Date.now(),
                    empId: currentUser.id,
                    empName: `${currentUser.name} (${currentUser.jobTitle})`,
                    empNationalCode: currentUser.nationalCode || 'ثبت نشده',
                    title,
                    amount: Number(amount),
                    sheba,
                    description,
                    status: 'در انتظار بررسی',
                    date: dateStr,
                    trackingCode: '',
                    accNote: '',
                    receiptImage: null
                };

                setRequests([newItem, ...requests]);
                setAmount('');
                setTitle('');
                setSheba('');
                setDescription('');
            };

            // ثبت تغییرات حسابدار
            const handleAccountantSave = (e) => {
                e.preventDefault();
                if (!selectedReq) return;
                const updated = requests.map(r => r.id === selectedReq.id ? {
                    ...r,
                    status: accStatus,
                    trackingCode,
                    accNote,
                    receiptImage: receiptImg
                } : r);
                setRequests(updated);
                setSelectedReq(null);
            };

            const openReqForEdit = (req) => {
                setSelectedReq(req);
                setAccStatus(req.status);
                setTrackingCode(req.trackingCode || '');
                setAccNote(req.accNote || '');
                setReceiptImg(req.receiptImage || null);
            };

            // فیلتر درخواست‌های کارمند فعلی
            const myRequests = useMemo(() => {
                if (!currentUser || currentUser.role !== 'employee') return [];
                return requests.filter(r => r.empId === currentUser.id);
            }, [requests, currentUser]);

            // فیلتر درخواست‌ها برای حسابداری
            const filteredAccRequests = useMemo(() => {
                if (filterStatus === 'همه') return requests;
                return requests.filter(r => r.status === filterStatus);
            }, [requests, filterStatus]);

            // ==================== صفحه ورود و ثبت‌نام ====================
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-md w-full animate-fade border border-white/20">
                            <div className="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-500/30">
                                <Icons.Truck />
                            </div>
                            <h1 className="text-2xl font-black text-center text-slate-800 mb-1">سامانه مالی باربری</h1>
                            <p className="text-center text-slate-500 text-xs mb-6">ورود امن کارمندان و واحد حسابداری</p>

                            {/* تب‌های انتخاب نوع ورود */}
                            <div className="grid grid-cols-3 gap-1 bg-slate-100 p-1.5 rounded-2xl mb-6 text-xs font-bold">
                                <button 
                                    onClick={() => { setAuthTab('emp_login'); setAuthError(''); }}
                                    className={`py-2.5 rounded-xl transition ${authTab === 'emp_login' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                                >
                                    ورود کارمند
                                </button>
                                <button 
                                    onClick={() => { setAuthTab('emp_register'); setAuthError(''); }}
                                    className={`py-2.5 rounded-xl transition ${authTab === 'emp_register' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                                >
                                    ثبت‌نام کارمند
                                </button>
                                <button 
                                    onClick={() => { setAuthTab('acc_login'); setAuthError(''); }}
                                    className={`py-2.5 rounded-xl transition ${authTab === 'acc_login' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                                >
                                    واحد حسابداری
                                </button>
                            </div>

                            {authError && (
                                <div className="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold text-center animate-fade">
                                    {authError}
                                </div>
                            )}

                            {/* فرم ۱: ورود کارمند */}
                            {authTab === 'emp_login' && (
                                <form onSubmit={handleEmployeeLogin} className="space-y-4 animate-fade">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">نام کاربری یا کد ملی</label>
                                        <input 
                                            type="text" 
                                            dir="ltr"
                                            placeholder="Username / National Code"
                                            value={loginUsername}
                                            onChange={e => setLoginUsername(e.target.value)}
                                            className="w-full border border-slate-200 bg-slate-50 focus:bg-white rounded-xl p-3 text-sm text-left focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">رمز عبور</label>
                                        <input 
                                            type="password" 
                                            dir="ltr"
                                            placeholder="••••••"
                                            value={loginPassword}
                                            onChange={e => setLoginPassword(e.target.value)}
                                            className="w-full border border-slate-200 bg-slate-50 focus:bg-white rounded-xl p-3 text-sm text-left focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 transition">
                                        <Icons.User />
                                        <span>ورود به پنل کارمند</span>
                                    </button>
                                    <div className="text-center pt-2">
                                        <p className="text-xs text-slate-400">اکانت نمونه جهت تست: نام کاربری <code className="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-slate-700">ali</code> و رمز <code className="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-slate-700">123</code></p>
                                    </div>
                                </form>
                            )}

                            {/* فرم ۲: ثبت‌نام کارمند جدید همراه با کد ملی */}
                            {authTab === 'emp_register' && (
                                <form onSubmit={handleEmployeeRegister} className="space-y-3.5 animate-fade">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">نام و نام خانوادگی کارمند *</label>
                                        <input 
                                            type="text" 
                                            placeholder="مثلاً: رضا محمدی"
                                            value={regName}
                                            onChange={e => setRegName(e.target.value)}
                                            className="w-full border border-slate-200 bg-slate-50 focus:bg-white rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">کد ملی (۱۰ رقمی) *</label>
                                        <input 
                                            type="text" 
                                            dir="ltr"
                                            maxLength="10"
                                            placeholder="0012345678"
                                            value={regNationalCode}
                                            onChange={e => setRegNationalCode(e.target.value.replace(/\D/g, ''))}
                                            className="w-full border border-slate-200 bg-slate-50 focus:bg-white rounded-xl p-3 text-sm text-left font-mono tracking-wider focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">سمت یا بخش در باربری</label>
                                        <input 
                                            type="text" 
                                            placeholder="مثلاً: صدور بارنامه / ترخیص"
                                            value={regJobTitle}
                                            onChange={e => setRegJobTitle(e.target.value)}
                                            className="w-full border border-slate-200 bg-slate-50 focus:bg-white rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">نام کاربری دلخواه (انگلیسی) *</label>
                                        <input 
                                            type="text" 
                                            dir="ltr"
                                            placeholder="مثلاً: reza88"
                                            value={regUsername}
                                            onChange={e => setRegUsername(e.target.value)}

                                                            <Icons.Upload />
                                                            <span className="text-xs font-bold text-emerald-700 mt-1">
                                                                {uploading ? 'در حال بهینه‌سازی تصویر...' : 'انتخاب عکس رسید از گالری یا فایل‌ها'}
                                                            </span>
                                                            <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                                                        </label>

                                                        {receiptImg && (
                                                            <div className="mt-3 relative bg-slate-100 p-2 rounded-2xl border">
                                                                <img src={receiptImg} alt="پیش‌نمایش رسید" className="max-h-40 mx-auto rounded-xl object-contain" />
                                                                <button 
                                                                    type="button" 
                                                                    onClick={() => setReceiptImg(null)}
                                                                    className="mt-2 w-full text-xs text-rose-600 font-bold py-1 bg-rose-50 rounded-lg"
                                                                >
                                                                    حذف تصویر رسید
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>

                                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/25 transition">
                                                        ذخیره وضعیت و ارسال به کارمند
                                                    </button>
                                                </div>
                                            </form>
                                        ) : (
                                            <div className="bg-white rounded-3xl p-10 text-center border-2 border-dashed border-slate-200 sticky top-24">
                                                <div className="w-12 h-12 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                                    <Icons.Calculator />
                                                </div>
                                                <p className="font-bold text-slate-600 text-sm">هیچ درخواستی انتخاب نشده است</p>
                                                <p className="text-xs text-slate-400 mt-1">از لیست سمت راست، روی یکی از درخواست‌ها ضربه بزنید تا پنل تغییر وضعیت و آپلود رسید باز شود.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* مودال تغییر رمز عبور حسابداری */}
                    {showPassModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form onSubmit={handleChangeAccPassword} className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl animate-fade">
                                <h3 className="font-extrabold text-slate-800 text-base mb-2">تغییر رمز عبور واحد حسابداری</h3>
                                <p className="text-xs text-slate-500 mb-4">رمز عبور جدیدی برای ورود به پنل مدیریت حسابداری تعیین کنید:</p>
                                <input 
                                    type="text" 
                                    dir="ltr"
                                    placeholder="رمز عبور جدید (حداقل ۴ رقم)"
                                    value={newAccPass}
                                    onChange={e => setNewAccPass(e.target.value)}
                                    className="w-full border border-slate-200 rounded-xl p-3 text-sm text-center font-mono mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                    required
                                />
                                <div className="flex gap-2">
                                    <button type="submit" className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-emerald-700">
                                        ذخیره رمز جدید
                                    </button>
                                    <button type="button" onClick={() => setShowPassModal(false)} className="bg-slate-100 text-slate-600 font-bold px-4 py-2.5 rounded-xl text-xs hover:bg-slate-200">
                                        انصراف
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* مودال بزرگنمایی عکس رسید */}
                    {previewModalImg && (
                        <div onClick={() => setPreviewModalImg(null)} className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="max-w-xl w-full bg-white p-3 rounded-3xl shadow-2xl animate-fade">
                                <img src={previewModalImg} alt="رسید بزرگ" className="w-full max-h-[80vh] object-contain rounded-2xl" />
                                <button onClick={() => setPreviewModalImg(null)} className="mt-3 w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm">
                                    بستن تصویر
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
