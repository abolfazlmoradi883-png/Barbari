<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سامانه جامع مالی و پرداخت باربری</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { font-family: 'Vazirmatn', sans-serif; }
        body { background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // آیکون‌های گرافیکی SVG
        const Icons = {
            Truck: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 17a2 2 0 11-4 0 2 2 0 014 0zm10 0a2 2 0 11-4 0 2 2 0 014 0zM13 17H8m10 0h2v-4l-3-5h-4v9zm0 0H8M3 17h1m-1-4h10V6H3v7z"/></svg>,
            User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
            Calculator: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>,
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>,
            Clock: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            Upload: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
            Switch: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>,
            Image: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        };

        const EMPLOYEES = [
            { id: 'emp1', name: 'علی رضایی (ترخیص و بارنامه)' },
            { id: 'emp2', name: 'محمد حسینی (امور رانندگان)' },
            { id: 'emp3', name: 'سارا احمدی (اداری و صدور)' }
        ];

        const STATUS_CONFIG = {
            'در انتظار بررسی': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', dot: 'bg-amber-500' },
            'در حال پرداخت': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', dot: 'bg-blue-500' },
            'پرداخت شده': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', dot: 'bg-emerald-500' },
            'رد شده': { bg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200', dot: 'bg-rose-500' }
        };

        function App() {
            const [role, setRole] = useState(null); // 'employee' | 'accountant'
            const [currentEmp, setCurrentEmp] = useState(EMPLOYEES[0]);
            const [requests, setRequests] = useState([]);
            const [filterStatus, setFilterStatus] = useState('همه');
            const [previewModalImg, setPreviewModalImg] = useState(null);

            // استیت‌های فرم کارمند
            const [amount, setAmount] = useState('');
            const [title, setTitle] = useState('');
            const [sheba, setSheba] = useState('');
            const [description, setDescription] = useState('');

            // استیت‌های فرم حسابداری
            const [selectedReq, setSelectedReq] = useState(null);
            const [accStatus, setAccStatus] = useState('در حال پرداخت');
            const [trackingCode, setTrackingCode] = useState('');
            const [accNote, setAccNote] = useState('');
            const [receiptImg, setReceiptImg] = useState(null);
            const [uploading, setUploading] = useState(false);

            // بارگذاری اولیه اطلاعات
            useEffect(() => {
                const saved = localStorage.getItem('barbari_pro_v2');
                if (saved) {
                    setRequests(JSON.parse(saved));
                } else {
                    const demoData = [
                        {
                            id: 1710001,
                            empId: 'emp1',
                            empName: 'علی رضایی (ترخیص و بارنامه)',
                            title: 'بیعانه کرایه تریلی کفی - بار تهران به بندرعباس',
                            amount: 18500000,
                            sheba: '6037-9975-9912-3456',
                            description: 'راننده آقای کریمی، پلاک ۴۴ع۷۸۹ ایران ۱۰ - نیازمند واریز فوری جهت حرکت',
                            status: 'پرداخت شده',
                            date: '۱۴۰۵/۰۸/۱۷ - ۱۰:۳۰',
                            trackingCode: '۸۸۴۹۲۰۱۱۲۴',
                            accNote: 'از حساب ملت باربری واریز شد.',
                            receiptImage: null
                        },
                        {
                            id: 1710002,
                            empId: 'emp1',
                            empName: 'علی رضایی (ترخیص و بارنامه)',
                            title: 'هزینه باسکول و تخلیه انبار غرب',
                            amount: 1200000,
                            sheba: '5892-1011-4455-8899',
                            description: 'بابت ۳ دستگاه خاور بار تجاری',
                            status: 'در حال پرداخت',
                            date: '۱۴۰۵/۰۸/۱۷ - ۱۲:۱۵',
                            trackingCode: '',
                            accNote: 'در لیست پرداخت عصر قرار گرفت.',
                            receiptImage: null
                        }
                    ];
                    setRequests(demoData);
                    localStorage.setItem('barbari_pro_v2', JSON.stringify(demoData));
                }
            }, []);

            useEffect(() => {
                if (requests.length > 0) {
                    localStorage.setItem('barbari_pro_v2', JSON.stringify(requests));
                }
            }, [requests]);

            const formatNumber = (num) => Number(num).toLocaleString('fa-IR');

            // آپلود و فشرده‌سازی عکس تا ۱۰ مگابایت
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 10 * 1024 * 1024) {
                    alert('حجم تصویر نباید بیشتر از ۱۰ مگابایت باشد!');
                    return;
                }
                setUploading(true);
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        const scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        setReceiptImg(canvas.toDataURL('image/jpeg', 0.75));
                        setUploading(false);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            // ثبت درخواست کارمند
            const handleCreateRequest = (e) => {
                e.preventDefault();
                if (!amount || !title) return;
                const now = new Date();
                const dateStr = now.toLocaleDateString('fa-IR') + ' - ' + now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

                const newItem = {
                    id: Date.now(),
                    empId: currentEmp.id,
                    empName: currentEmp.name,
                    title,
                    amount: Number(amount),
                    sheba,
                    description,
                    status: 'در انتظار بررسی',
                    date: dateStr,
                    trackingCode: '',
                    accNote: '',
                    receiptImage: null
                };

                setRequests([newItem, ...requests]);
                setAmount('');
                setTitle('');
                setSheba('');
                setDescription('');
            };

            // ثبت تغییرات حسابدار
            const handleAccountantSave = (e) => {
                e.preventDefault();
                if (!selectedReq) return;
                const updated = requests.map(r => r.id === selectedReq.id ? {
                    ...r,
                    status: accStatus,
                    trackingCode,
                    accNote,
                    receiptImage: receiptImg
                } : r);
                setRequests(updated);
                setSelectedReq(null);
            };

            const openReqForEdit = (req) => {
                setSelectedReq(req);
                setAccStatus(req.status);
                setTrackingCode(req.trackingCode || '');
                setAccNote(req.accNote || '');
                setReceiptImg(req.receiptImage || null);
            };

            // فیلتر درخواست‌های کارمند فعلی (هر کارمند فقط مال خودش رو ببینه)
            const myRequests = useMemo(() => requests.filter(r => r.empId === currentEmp.id), [requests, currentEmp]);

            // فیلتر درخواست‌ها برای حسابداری
            const filteredAccRequests = useMemo(() => {
                if (filterStatus === 'همه') return requests;
                return requests.filter(r => r.status === filterStatus);
            }, [requests, filterStatus]);

            // صفحه ورود و انتخاب نقش
            if (!role) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 max-w-lg w-full animate-fade border border-white/20">
                            <div className="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                                <Icons.Truck />
                            </div>
                            <h1 className="text-2xl font-black text-center text-slate-800 mb-2">سامانه پرداخت باربری</h1>
                            <p className="text-center text-slate-500 text-sm mb-8">مدیریت هوشمند حواله‌ها، کرایه حمل و رسیدهای بانکی</p>

                            <div className="space-y-4">
                                {/* بخش ورود کارمند */}
                                <div className="p-5 rounded-2xl border-2 border-slate-100 bg-slate-50/70 hover:border-indigo-200 transition">
                                    <label className="block text-xs font-bold text-slate-500 mb-2">انتخاب حساب کارمند:</label>
                                    <select 
                                        value={currentEmp.id}
                                        onChange={(e) => setCurrentEmp(EMPLOYEES.find(emp => emp.id === e.target.value))}
                                        className="w-full p-3 rounded-xl border border-slate-200 bg-white text-sm font-medium mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    >
                                        {EMPLOYEES.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
                                    </select>
                                    <button 
                                        onClick={() => setRole('employee')}
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 transition active:scale-[0.99]"
                                    >
                                        <Icons.User />
                                        <span>ورود به پنل کارمند</span>
                                    </button>
                                </div>

                                <div className="relative flex py-1 items-center">
                                    <div className="flex-grow border-t border-slate-200"></div>
                                    <span className="flex-shrink mx-4 text-slate-400 text-xs">یا</span>
                                    <div className="flex-grow border-t border-slate-200"></div>
                                </div>

                                {/* دکمه ورود حسابداری */}
                                <button 
                                    onClick={() => setRole('accountant')}
                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 transition active:scale-[0.99]"
                                >
                                    <Icons.Calculator />
                                    <span>ورود به پنل مدیریت حسابداری</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-12">
                    {/* نوار بالای برنامه (Header) */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3">
                                <div className={`w-11 h-11 rounded-xl flex items-center justify-center text-white shadow-md ${role === 'employee' ? 'bg-indigo-600' : 'bg-emerald-600'}`}>
                                    {role === 'employee' ? <Icons.User /> : <Icons.Calculator />}
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h2 className="font-extrabold text-slate-800 text-base md:text-lg">
                                            {role === 'employee' ? 'پنل درخواست پرداخت کارمند' : 'پنل مرکزی واحد حسابداری'}
                                        </h2>
                                        <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${role === 'employee' ? 'bg-indigo-50 text-indigo-700' : 'bg-emerald-50 text-emerald-700'}`}>
                                            {role === 'employee' ? currentEmp.name : 'دسترسی کل درخواست‌ها'}
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-0.5">سیستم یکپارچه مالی باربری</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                {role === 'employee' && (
                                    <select 
                                        value={currentEmp.id}
                                        onChange={(e) => setCurrentEmp(EMPLOYEES.find(emp => emp.id === e.target.value))}
                                        className="text-xs bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 font-medium focus:outline-none"
                                    >
                                        {EMPLOYEES.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
                                    </select>
                                )}
                                <button 
                                    onClick={() => { setRole(role === 'employee' ? 'accountant' : 'employee'); setSelectedReq(null); }}
                                    className="flex items-center gap-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2.5 rounded-xl transition shadow-sm"
                                >
                                    <Icons.Switch />
                                    <span>جابجایی سریع به {role === 'employee' ? 'حسابداری' : 'کارمند'}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 mt-6">
                        {/* ==================== نمای کارمند ==================== */}
                        {role === 'employee' && (
                            <div className="space-y-6 animate-fade">
                                {/* کارت‌های آماری کارمند */}
                                <div className="grid grid-cols-3 gap-3 md:gap-5">
                                    <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                                        <p className="text-xs text-slate-400 font-medium">کل درخواست‌های من</p>
                                        <p className="text-xl md:text-2xl font-black text-slate-800 mt-1">{myRequests.length} <span className="text-xs font-normal text-slate-400">مورد</span></p>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                                        <p className="text-xs text-amber-600 font-medium">در جریان / انتظار</p>
                                        <p className="text-xl md:text-2xl font-black text-amber-600 mt-1">
                                            {myRequests.filter(r => r.status === 'در انتظار بررسی' || r.status === 'در حال پرداخت').length} <span className="text-xs font-normal">مورد</span>
                                        </p>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                                        <p className="text-xs text-emerald-600 font-medium">پرداخت شده</p>
                                        <p className="text-xl md:text-2xl font-black text-emerald-600 mt-1">
                                            {myRequests.filter(r => r.status === 'پرداخت شده').length} <span className="text-xs font-normal">رسید</span>
                                        </p>
                                    </div>
                                </div>

                                <div className="grid lg:grid-cols-12 gap-6">
                                    {/* فرم ثبت درخواست */}
                                    <div className="lg:col-span-5">
                                        <form onSubmit={handleCreateRequest} className="bg-white p-6 rounded-3xl border border-slate-200/90 shadow-sm sticky top-24">
                                            <div className="flex items-center gap-2 pb-4 mb-5 border-b border-slate-100">
                                                <div className="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                                                    <Icons.Plus />
                                                </div>
                                                <h3 className="font-extrabold text-slate-800">ثبت درخواست پرداخت جدید</h3>
                                            </div>

                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-600 mb-1.5">موضوع پرداخت (بابت) *</label>
                                                    <input 
                                                        type="text" 
                                                        placeholder="مثلاً: کرایه حمل بار تریلی تهران-شیراز"
                                                        value={title} 
                                                        onChange={e => setTitle(e.target.value)}
                                                        className="w-full border border-slate-200 bg-slate-50/50 focus:bg-white rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                                                        required 
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-bold text-slate-600 mb-1.5">مبلغ درخواستی (تومان) *</label>
                                                    <input 
                                                        type="number" 
                                                        placeholder="مثلاً 15000000"
                                                        value={amount} 
                                                        onChange={e => setAmount(e.target.value)}
                                                        className="w-full border border-slate-200 bg-slate-50/50 focus:bg-white rounded-xl p-3 text-sm font-bold text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                                                        required 
                                                    />
                                                    {amount && (
                                                        <p className="text-xs text-indigo-600 font-medium mt-1.5 bg-indigo-50/70 px-3 py-1 rounded-lg inline-block">
                                                            معادل: {formatNumber(amount)} تومان
                                                        </p>
                                                    )}
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-bold text-slate-600 mb-1.5">شماره کارت یا شبا مقصد (راننده / ذینفع)</label>
                                                    <input 
                                                        type="text" 
                                                        dir="ltr"
                                                        placeholder="6037-XXXX-XXXX-XXXX / IR..."
                                                        value={sheba} 
                                                        onChange={e => setSheba(e.target.value)}
                                                        className="w-full border border-slate-200 bg-slate-50/50 focus:bg-white rounded-xl p-3 text-sm text-left font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-bold text-slate-600 mb-1.5">توضیحات تکمیلی (شماره بارنامه، نام راننده و...)</label>
                                                    <textarea 
                                                        rows="3"
                                                        placeholder="جزئیات مربوط به بارنامه یا راننده را بنویسید..."
                                                        value={description} 
                                                        onChange={e => setDescription(e.target.value)}
                                                        className="w-full border border-slate-200 bg-slate-50/50 focus:bg-white rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                                                    ></textarea>
                                                </div>

                                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/25 transition active:scale-[0.99]">
                                                    ارسال فرم به واحد حسابداری
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    {/* لیست درخواست‌های همین کارمند */}
                                    <div className="lg:col-span-7 space-y-4">
                                        <div className="flex items-center justify-between bg-white px-5 py-4 rounded-2xl border border-slate-200/80 shadow-sm">
                                            <h3 className="font-extrabold text-slate-800 text-sm md:text-base">سوابق و رسیدهای من ({currentEmp.name})</h3>
                                            <span className="text-xs text-slate-400">محرمانه ویژه کارمند</span>
                                        </div>

                                        {myRequests.length === 0 ? (
                                            <div className="bg-white rounded-3xl p-12 text-center border border-dashed border-slate-300">
                                                <p className="text-slate-400 text-sm">شما هنوز هیچ درخواست پرداختی ثبت نکرده‌اید.</p>
                                            </div>
                                        ) : (
                                            myRequests.map(req => {
                                                const st = STATUS_CONFIG[req.status] || STATUS_CONFIG['در انتظار بررسی'];
                                                return (
                                                    <div key={req.id} className="bg-white rounded-3xl p-5 border border-slate-200/90 shadow-sm hover:shadow-md transition animate-fade">
                                                        <div className="flex flex-wrap items-start justify-between gap-2 pb-3 border-b border-slate-100">
                                                            <div>
                                                                <h4 className="font-extrabold text-slate-800 text-base">{req.title}</h4>
                                                                <span className="text-xs text-slate-400 mt-0.5 block">{req.date}</span>
                                                            </div>
                                                            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold border ${st.bg} ${st.text} ${st.border}`}>
                                                                <span className={`w-2 h-2 rounded-full ${st.dot}`}></span>
                                                                {req.status}
                                                            </span>
                                                        </div>

                                                        <div className="my-3 flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-3.5 rounded-2xl">
                                                            <div>
                                                                <span className="text-xs text-slate-400 block">مبلغ درخواستی:</span>
                                                                <span className="text-lg font-black text-indigo-700">{formatNumber(req.amount)} تومان</span>
                                                            </div>
                                                            {req.sheba && (
                                                                <div className="text-left">
                                                                    <span className="text-xs text-slate-400 block">شماره حساب/کارت:</span>
                                                                    <span className="text-xs font-mono font-bold text-slate-700 bg-white px-2.5 py-1 rounded-lg border">{req.sheba}</span>
                                                                </div>
                                                            )}
                                                        </div>

                                                        {req.description && <p className="text-xs text-slate-600 leading-relaxed mb-3">{req.description}</p>}

                                                        {/* بخش پاسخ و رسید حسابداری */}
                                                        {(req.trackingCode || req.accNote || req.receiptImage) && (
                                                            <div className="mt-4 pt-3 border-t border-dashed border-slate-200 bg-emerald-50/40 p-3.5 rounded-2xl">
                                                                <p className="text-xs font-bold text-emerald-800 mb-2">پاسخ واحد حسابداری:</p>
                                                                {req.trackingCode && (
                                                                    <p className="text-xs text-slate-700 mb-1"><strong>کد پیگیری بانکی:</strong> <span className="font-mono bg-white px-2 py-0.5 rounded border">{req.trackingCode}</span></p>
                                                                )}
                                                                {req.accNote && (
                                                                    <p className="text-xs text-slate-600 mb-2"><strong>توضیح حسابدار:</strong> {req.accNote}</p>
                                                                )}
                                                                {req.receiptImage && (
                                                                    <div className="mt-2">
                                                                        <p className="text-xs text-slate-500 mb-1.5 flex items-center gap-1"><Icons.Image /> تصویر فیش واریزی (برای بزرگنمایی کلیک کنید):</p>
                                                                        <img 
                                                                            src={req.receiptImage} 
                                                                            onClick={() => setPreviewModalImg(req.receiptImage)}
                                                                            alt="رسید پرداخت" 
                                                                            className="max-h-44 rounded-xl border border-emerald-200 cursor-pointer hover:opacity-90 transition object-contain bg-white p-1" 
                                                                        />
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ==================== نمای حسابداری ==================== */}
                        {role === 'accountant' && (
                            <div className="space-y-6 animate-fade">
                                {/* فیلتر وضعیت‌ها */}
                                <div className="bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                                    <div className="flex flex-wrap gap-1.5">
                                        {['همه', 'در انتظار بررسی', 'در حال پرداخت', 'پرداخت شده', 'رد شده'].map(st => (
                                            <button
                                                key={st}
                                                onClick={() => setFilterStatus(st)}
                                                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${filterStatus === st ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                            >
                                                {st} ({st === 'همه' ? requests.length : requests.filter(r => r.status === st).length})
                                            </button>
                                        ))}
                                    </div>
                                    <span className="text-xs text-slate-400 px-2">روی هر درخواست کلیک کنید تا وضعیت و رسید را ثبت کنید</span>
                                </div>

                                <div className="grid lg:grid-cols-12 gap-6">
                                    {/* لیست کل درخواست‌ها */}
                                    <div className="lg:col-span-7 space-y-3.5">
                                        {filteredAccRequests.map(req => {
                                            const st = STATUS_CONFIG[req.status] || STATUS_CONFIG['در انتظار بررسی'];
                                            const isSelected = selectedReq?.id === req.id;
                                            return (
                                                <div 
                                                    key={req.id} 
                                                    onClick={() => openReqForEdit(req)}
                                                    className={`bg-white rounded-3xl p-5 border-2 transition cursor-pointer ${isSelected ? 'border-emerald-500 ring-4 ring-emerald-500/10 shadow-md' : 'border-slate-200/80 hover:border-emerald-300 shadow-sm'}`}
                                                >
                                                    <div className="flex items-start justify-between gap-2 mb-2">
                                                        <div>
                                                            <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-md inline-block mb-1">{req.empName}</span>
                                                            <h4 className="font-extrabold text-slate-800">{req.title}</h4>
                                                        </div>
                                                        <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold border ${st.bg} ${st.text} ${st.border}`}>
                                                            <span className={`w-2 h-2 rounded-full ${st.dot}`}></span>
                                                            {req.status}
                                                        </span>
                                                    </div>

                                                    <div className="flex items-center justify-between bg-slate-50 px-4 py-2.5 rounded-xl my-2.5">
                                                        <span className="text-base font-black text-slate-800">{formatNumber(req.amount)} تومان</span>
                                                        <span className="text-xs text-slate-400">{req.date}</span>
                                                    </div>

                                                    {req.sheba && <p className="text-xs font-mono text-slate-500 mb-1">حساب/کارت: {req.sheba}</p>}
                                                    {req.description && <p className="text-xs text-slate-600 line-clamp-2">{req.description}</p>}

                                                    <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                                                        <span className="text-emerald-600 font-bold">جهت تغییر وضعیت و آپلود فیش کلیک کنید ←</span>
                                                        {req.receiptImage && <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md font-medium">دارای عکس رسید ✓</span>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* پنل ویرایش و ارسال رسید توسط حسابدار */}
                                    <div className="lg:col-span-5">
                                        {selectedReq ? (
                                            <form onSubmit={handleAccountantSave} className="bg-white p-6 rounded-3xl border-2 border-emerald-500/40 shadow-xl sticky top-24 animate-fade">
                                                <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
                                                    <h3 className="font-extrabold text-slate-800">بررسی و ثبت رسید پرداخت</h3>
                                                    <button type="button" onClick={() => setSelectedReq(null)} className="text-xs text-slate-400 hover:text-slate-600">بستن ✕</button>
                                                </div>

                                                <div className="bg-slate-50 p-3.5 rounded-2xl mb-4 text-xs space-y-1 border border-slate-200/60">
                                                    <p><strong>درخواست‌دهنده:</strong> {selectedReq.empName}</p>
                                                    <p><strong>بابت:</strong> {selectedReq.title}</p>
                                                    <p className="text-sm font-black text-emerald-700 pt-1">مبلغ: {formatNumber(selectedReq.amount)} تومان</p>
                                                    {selectedReq.sheba && <p className="font-mono text-slate-600">شماره حساب: {selectedReq.sheba}</p>}
                                                </div>

                                                <div className="space-y-4">
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">تعیین وضعیت درخواست</label>
                                                        <select 
                                                            value={accStatus} 
                                                            onChange={e => setAccStatus(e.target.value)}
                                                            className="w-full border border-slate-200 rounded-xl p-3 text-sm font-bold bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                                        >
                                                            <option value="در انتظار بررسی">🟡 در انتظار بررسی</option>
                                                            <option value="در حال پرداخت">🔵 در حال پرداخت (در صف بانک)</option>
                                                            <option value="پرداخت شده">🟢 پرداخت شده (تکمیل و ارسال رسید)</option>
                                                            <option value="رد شده">🔴 رد شده (نقص اطلاعات)</option>
                                                        </select>
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">شماره پیگیری / ارجاع بانکی</label>
                                                        <input 
                                                            type="text" 
                                                            placeholder="مثلاً: 994827164"
                                                            value={trackingCode}
                                                            onChange={e => setTrackingCode(e.target.value)}
                                                            className="w-full border border-slate-200 rounded-xl p-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                                        />
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">توضیحات حسابداری برای کارمند</label>
                                                        <textarea 
                                                            rows="2"
                                                            placeholder="توضیحی در مورد زمان واریز یا علت رد شدن..."
                                                            value={accNote}
                                                            onChange={e => setAccNote(e.target.value)}
                                                            className="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                                        ></textarea>
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">پیوست تصویر رسید بانکی (تا ۱۰ مگابایت)</label>
                                                        <label className="flex flex-col items-center justify-center border-2 border-dashed border-emerald-300 bg-emerald-50/40 hover:bg-emerald-50 rounded-2xl p-4 cursor-pointer transition">
                                                            <Icons.Upload />
                                                            <span className="text-xs font-bold text-emerald-700 mt-1">
                                                                {uploading ? 'در حال بهینه‌سازی تصویر...' : 'انتخاب عکس رسید از گالری یا فایل‌ها'}
                                                            </span>
                                                            <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                                                        </label>

                                                        {receiptImg && (
                                                            <div className="mt-3 relative bg-slate-100 p-2 rounded-2xl border">
                                                                <img src={receiptImg} alt="پیش‌نمایش رسید" className="max-h-40 mx-auto rounded-xl object-contain" />
                                                                <button 
                                                                    type="button" 
                                                                    onClick={() => setReceiptImg(null)}
                                                                    className="mt-2 w-full text-xs text-rose-600 font-bold py-1 bg-rose-50 rounded-lg"
                                                                >
                                                                    حذف تصویر رسید
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>

                                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/25 transition">
                                                        ذخیره وضعیت و ارسال به کارمند
                                                    </button>
                                                </div>
                                            </form>
                                        ) : (
                                            <div className="bg-white rounded-3xl p-10 text-center border-2 border-dashed border-slate-200 sticky top-24">
                                                <div className="w-12 h-12 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                                    <Icons.Calculator />
                                                </div>
                                                <p className="font-bold text-slate-600 text-sm">هیچ درخواستی انتخاب نشده است</p>
                                                <p className="text-xs text-slate-400 mt-1">از لیست سمت راست، روی یکی از درخواست‌ها ضربه بزنید تا پنل تغییر وضعیت و آپلود رسید باز شود.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* مودال بزرگنمایی عکس رسید */}
                    {previewModalImg && (
                        <div onClick={() => setPreviewModalImg(null)} className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="max-w-xl w-full bg-white p-3 rounded-3xl shadow-2xl animate-fade">
                                <img src={previewModalImg} alt="رسید بزرگ" className="w-full max-h-[80vh] object-contain rounded-2xl" />
                                <button onClick={() => setPreviewModalImg(null)} className="mt-3 w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm">
                                    بستن تصویر
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
