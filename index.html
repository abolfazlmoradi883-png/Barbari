<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سامانه جامع مالی و پرداخت باربری</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { font-family: 'Vazirmatn', sans-serif; }
        body { background-color: #f1f5f9; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // آیکون‌های گرافیکی SVG
        const Icons = {
            Truck: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 17a2 2 0 11-4 0 2 2 0 014 0zm10 0a2 2 0 11-4 0 2 2 0 014 0zM13 17H8m10 0h2v-4l-3-5h-4v9zm0 0H8M3 17h1m-1-4h10V6H3v7z"/></svg>,
            User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
            UserPlus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>,
            Lock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>,
            Calculator: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>,
            Upload: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
            Logout: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>,
            Key: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>,
            Image: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
            Settings: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        };

        const STATUS_CONFIG = {
            'در انتظار بررسی': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', dot: 'bg-amber-500' },
            'در حال پرداخت': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', dot: 'bg-blue-500' },
            'پرداخت شده': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', dot: 'bg-emerald-500' },
            'رد شده': { bg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200', dot: 'bg-rose-500' }
        };

        function App() {
            // وضعیت احراز هویت و کاربران
            const [currentUser, setCurrentUser] = useState(null);
            const [authTab, setAuthTab] = useState('emp_login');
            const [authError, setAuthError] = useState('');

            // لیست کارمندان ثبت‌نام شده و رمز حسابداری
            const [employees, setEmployees] = useState([]);
            const [accPassword, setAccPassword] = useState('123456');

            // فیلدهای ورود و ثبت‌نام
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [regName, setRegName] = useState('');
            const [regNationalCode, setRegNationalCode] = useState('');
            const [regJobTitle, setRegJobTitle] = useState('');
            const [regUsername, setRegUsername] = useState('');
            const [regPassword, setRegPassword] = useState('');
            const [accPassInput, setAccPassInput] = useState('');

            // مودال پروفایل و تنظیمات کاربری (با کلیک روی آیکون هدر)
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [profileTab, setProfileTab] = useState('info'); // 'info' | 'security' | 'users' | 'backup'
            const [profName, setProfName] = useState('');
            const [profJobTitle, setProfJobTitle] = useState('');
            const [profNationalCode, setProfNationalCode] = useState('');
            const [profUsername, setProfUsername] = useState('');
            const [profDefaultSheba, setProfDefaultSheba] = useState('');
            const [profCurrentPass, setProfCurrentPass] = useState('');
            const [profNewPass, setProfNewPass] = useState('');
            const [profMsg, setProfMsg] = useState({ type: '', text: '' });

            // استیت‌های درخواست‌ها و جستجو
            const [requests, setRequests] = useState([]);
            const [filterStatus, setFilterStatus] = useState('همه');
            const [searchQuery, setSearchQuery] = useState('');
            const [previewModalImg, setPreviewModalImg] = useState(null);

            // استیت‌های فرم کارمند
            const [amount, setAmount] = useState('');
            const [title, setTitle] = useState('');
            const [sheba, setSheba] = useState('');
            const [description, setDescription] = useState('');

            // استیت‌های فرم حسابداری
            const [selectedReq, setSelectedReq] = useState(null);
            const [accStatus, setAccStatus] = useState('در حال پرداخت');
            const [trackingCode, setTrackingCode] = useState('');
            const [accNote, setAccNote] = useState('');
            const [receiptImg, setReceiptImg] = useState(null);
            const [uploading, setUploading] = useState(false);

            // بارگذاری اولیه از حافظه مرورگر
            useEffect(() => {
                const savedUsers = localStorage.getItem('barbari_users_v4');
                if (savedUsers) {
                    setEmployees(JSON.parse(savedUsers));
                } else {
                    const defaultUsers = [
                        { id: 'emp1', name: 'علی رضایی', nationalCode: '0012345678', jobTitle: 'ترخیص و بارنامه', username: 'ali', password: '123', defaultSheba: '6037-9975-9912-3456' },
                        { id: 'emp2', name: 'محمد حسینی', nationalCode: '0098765432', jobTitle: 'امور رانندگان', username: 'mohammad', password: '123', defaultSheba: '' }
                    ];
                    setEmployees(defaultUsers);
                    localStorage.setItem('barbari_users_v4', JSON.stringify(defaultUsers));
                }

                const savedAccPass = localStorage.getItem('barbari_acc_pass_v4');
                if (savedAccPass) {
                    setAccPassword(savedAccPass);
                } else {
                    localStorage.setItem('barbari_acc_pass_v4', '123456');
                }

                const savedReqs = localStorage.getItem('barbari_requests_v4');
                if (savedReqs) {
                    setRequests(JSON.parse(savedReqs));
                } else {
                    const demoData = [
                        {
                            id: 1710001,
                            empId: 'emp1',
                            empName: 'علی رضایی (ترخیص و بارنامه)',
                            empNationalCode: '0012345678',
                            title: 'بیعانه کرایه تریلی کفی - بار تهران به بندرعباس',
                            amount: 18500000,
                            sheba: '6037-9975-9912-3456',
                            description: 'راننده آقای کریمی، پلاک ۴۴ع۷۸۹ ایران ۱۰ - نیازمند واریز فوری جهت حرکت',
                            status: 'پرداخت شده',
                            date: '۱۴۰۵/۰۸/۱۷ - ۱۰:۳۰',
                            trackingCode: '۸۸۴۹۲۰۱۱۲۴',
                            accNote: 'از حساب ملت باربری واریز شد.',
                            receiptImage: null
                        }
                    ];
                    setRequests(demoData);
                    localStorage.setItem('barbari_requests_v4', JSON.stringify(demoData));
                }
            }, []);

            // ذخیره تغییرات درخواست‌ها
            useEffect(() => {
                localStorage.setItem('barbari_requests_v4', JSON.stringify(requests));
            }, [requests]);

            const formatNumber = (num) => Number(num).toLocaleString('fa-IR');

            // باز کردن پنجره پروفایل و تنظیم مقادیر اولیه
            const openProfileModal = () => {
                setProfMsg({ type: '', text: '' });
                setProfCurrentPass('');
                setProfNewPass('');
                if (currentUser.role === 'employee') {
                    setProfileTab('info');
                    setProfName(currentUser.name || '');
                    setProfJobTitle(currentUser.jobTitle || '');
                    setProfNationalCode(currentUser.nationalCode || '');
                    setProfUsername(currentUser.username || '');
                    setProfDefaultSheba(currentUser.defaultSheba || '');
                } else {
                    setProfileTab('security');
                }
                setShowProfileModal(true);
            };

            // ذخیره مشخصات کاربری کارمند (نام، نام کاربری، کد ملی، سمت و شبا پیش‌فرض)
            const handleUpdateEmployeeProfile = (e) => {
                e.preventDefault();
                setProfMsg({ type: '', text: '' });

                const cleanUser = profUsername.trim().toLowerCase();
                const cleanNC = profNationalCode.trim();

                if (!profName.trim() || !cleanUser || !cleanNC) {
                    setProfMsg({ type: 'error', text: 'نام، کد ملی و نام کاربری نمی‌توانند خالی باشند.' });
                    return;
                }
                if (!/^\d{10}$/.test(cleanNC)) {
                    setProfMsg({ type: 'error', text: 'کد ملی باید دقیقاً ۱۰ رقم عددی باشد.' });
                    return;
                }
                if (employees.some(u => u.id !== currentUser.id && u.username.toLowerCase() === cleanUser)) {
                    setProfMsg({ type: 'error', text: 'این نام کاربری متعلق به کارمند دیگری است.' });
                    return;
                }
                if (employees.some(u => u.id !== currentUser.id && u.nationalCode === cleanNC)) {
                    setProfMsg({ type: 'error', text: 'این کد ملی قبلاً برای کارمند دیگری ثبت شده است.' });
                    return;
                }

                const updatedEmp = {
                    ...currentUser,
                    name: profName.trim(),
                    jobTitle: profJobTitle.trim() || 'کارمند باربری',
                    nationalCode: cleanNC,
                    username: cleanUser,
                    defaultSheba: profDefaultSheba.trim()
                };

                const updatedList = employees.map(u => u.id === currentUser.id ? updatedEmp : u);
                setEmployees(updatedList);
                localStorage.setItem('barbari_users_v4', JSON.stringify(updatedList));
                setCurrentUser(updatedEmp);

                // بروزرسانی نام کارمند در درخواست‌های قبلی او
                const updatedReqs = requests.map(r => r.empId === currentUser.id ? {
                    ...r,
                    empName: `${updatedEmp.name} (${updatedEmp.jobTitle})`,
                    empNationalCode: updatedEmp.nationalCode
                } : r);
                setRequests(updatedReqs);

                if (!sheba && updatedEmp.defaultSheba) {
                    setSheba(updatedEmp.defaultSheba);
                }

                setProfMsg({ type: 'success', text: 'مشخصات حساب کاربری با موفقیت بروزرسانی شد!' });
            };

            // تغییر رمز عبور کارمند
            const handleUpdateEmployeePassword = (e) => {
                e.preventDefault();
                setProfMsg({ type: '', text: '' });

                if (profCurrentPass !== currentUser.password) {
                    setProfMsg({ type: 'error', text: 'رمز عبور فعلی را اشتباه وارد کرده‌اید.' });
                    return;
                }
                if (!profNewPass || profNewPass.length < 3) {
                    setProfMsg({ type: 'error', text: 'رمز عبور جدید باید حداقل ۳ کاراکتر باشد.' });
                    return;
                }

                const updatedEmp = { ...currentUser, password: profNewPass };
                const updatedList = employees.map(u => u.id === currentUser.id ? updatedEmp : u);
                setEmployees(updatedList);
                localStorage.setItem('barbari_users_v4', JSON.stringify(updatedList));
                setCurrentUser(updatedEmp);
                setProfCurrentPass('');
                setProfNewPass('');
                setProfMsg({ type: 'success', text: 'رمز عبور شما با موفقیت تغییر یافت!' });
            };

            // تغییر رمز عبور حسابداری
            const handleChangeAccPassword = (e) => {
                e.preventDefault();
                setProfMsg({ type: '', text: '' });
                if (!profNewPass || profNewPass.length < 4) {
                    setProfMsg({ type: 'error', text: 'رمز جدید حسابداری باید حداقل ۴ کاراکتر باشد.' });
                    return;
                }
                setAccPassword(profNewPass);
                localStorage.setItem('barbari_acc_pass_v4', profNewPass);
                setProfNewPass('');
                setProfMsg({ type: 'success', text: 'رمز عبور واحد حسابداری با موفقیت تغییر کرد.' });
            };

            // ریست کردن رمز کارمند توسط مدیر حسابداری
            const handleResetEmpPassByAdmin = (empId, empName) => {
                const newPass = prompt(`رمز عبور جدید برای "${empName}" را وارد کنید:`, '1234');
                if (newPass && newPass.trim()) {
                    const updated = employees.map(u => u.id === empId ? { ...u, password: newPass.trim() } : u);
                    setEmployees(updated);
                    localStorage.setItem('barbari_users_v4', JSON.stringify(updated));
                    alert(`رمز عبور ${empName} به "${newPass.trim()}" تغییر یافت.`);
                }
            };

            // حذف کارمند توسط مدیر حسابداری
            const handleDeleteEmployeeByAdmin = (empId, empName) => {
                if (confirm(`آیا از حذف حساب کاربری "${empName}" اطمینان دارید؟`)) {
                    const updated = employees.filter(u => u.id !== empId);
                    setEmployees(updated);
                    localStorage.setItem('barbari_users_v4', JSON.stringify(updated));
                }
            };

            // دانلود فایل پشتیبان (Backup)
            const handleDownloadBackup = () => {
                const data = {
                    employees,
                    accPassword,
                    requests,
                    exportDate: new Date().toLocaleDateString('fa-IR')
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `barbari-backup-${Date.now()}.json`;
                a.click();
            };

            // بازیابی فایل پشتیبان
            const handleRestoreBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (parsed.employees && parsed.requests) {
                            setEmployees(parsed.employees);
                            localStorage.setItem('barbari_users_v4', JSON.stringify(parsed.employees));
                            setRequests(parsed.requests);
                            localStorage.setItem('barbari_requests_v4', JSON.stringify(parsed.requests));
                            if (parsed.accPassword) {
                                setAccPassword(parsed.accPassword);
                                localStorage.setItem('barbari_acc_pass_v4', parsed.accPassword);
                            }
                            setProfMsg({ type: 'success', text: 'اطلاعات پشتیبان با موفقیت بازیابی شد!' });
                        } else {
                            setProfMsg({ type: 'error', text: 'فایل پشتیبان معتبر نیست.' });
                        }
                    } catch (err) {
                        setProfMsg({ type: 'error', text: 'خطا در خواندن فایل پشتیبان.' });
                    }
                };
                reader.readAsText(file);
            };

            // ورود کارمند
            const handleEmployeeLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                const cleanInput = loginUsername.trim().toLowerCase();
                const found = employees.find(u => 
                    (u.username.toLowerCase() === cleanInput || u.nationalCode === cleanInput) && 
                    u.password === loginPassword
                );
                if (!found) {
                    setAuthError('نام کاربری/کد ملی یا رمز عبور اشتباه است.');
                    return;
                }
                setCurrentUser({ role: 'employee', ...found });
                setSheba(found.defaultSheba || '');
                setLoginUsername('');
                setLoginPassword('');
            };

            // ثبت‌نام کارمند جدید
            const handleEmployeeRegister = (e) => {
                e.preventDefault();
                setAuthError('');
                const cleanUser = regUsername.trim().toLowerCase();
                const cleanNationalCode = regNationalCode.trim();

                if (!regName.trim() || !cleanNationalCode || !cleanUser || !regPassword) {
                    setAuthError('لطفاً تمام فیلدهای ستاره‌دار را تکمیل کنید.');
                    return;
                }
                if (!/^\d{10}$/.test(cleanNationalCode)) {
                    setAuthError('کد ملی باید دقیقاً ۱۰ رقم عددی باشد.');
                    return;
                }
                if (employees.some(u => u.nationalCode === cleanNationalCode)) {
                    setAuthError('این کد ملی قبلاً در سیستم ثبت شده است.');
                    return;
                }
                if (employees.some(u => u.username.toLowerCase() === cleanUser)) {
                    setAuthError('این نام کاربری قبلاً انتخاب شده است.');
                    return;
                }

                const newEmp = {
                    id: 'emp_' + Date.now(),
                    name: regName.trim(),
                    nationalCode: cleanNationalCode,
                    jobTitle: regJobTitle.trim() || 'کارمند باربری',
                    username: cleanUser,
                    password: regPassword,
                    defaultSheba: ''
                };

                const updatedUsers = [...employees, newEmp];
                setEmployees(updatedUsers);
                localStorage.setItem('barbari_users_v4', JSON.stringify(updatedUsers));

                setCurrentUser({ role: 'employee', ...newEmp });
                setRegName('');
                setRegNationalCode('');
                setRegJobTitle('');
                setRegUsername('');
                setRegPassword('');
            };

            // ورود حسابداری
            const handleAccountantLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                if (accPassInput !== accPassword) {
                    setAuthError('رمز عبور واحد حسابداری اشتباه است!');
                    return;
                }
                setCurrentUser({ role: 'accountant' });
                setAccPassInput('');
            };

            // آپلود و فشرده‌سازی عکس تا ۱۰ مگابایت
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 10 * 1024 * 1024) {
                    alert('حجم تصویر نباید بیشتر از ۱۰ مگابایت باشد!');
                    return;
                }
                setUploading(true);
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {

                                            <div key={emp.id} className="p-3 rounded-2xl border border-slate-200 bg-slate-50 flex items-center justify-between gap-2">
                                                <div>
                                                    <p className="text-xs font-extrabold text-slate-800">{emp.name} <span className="font-normal text-slate-500">({emp.jobTitle})</span></p>
                                                    <p className="text-[11px] font-mono text-slate-500 mt-0.5">
                                                        کاربری: <strong className="text-indigo-600">{emp.username}</strong> | رمز: <strong className="text-emerald-700">{emp.password}</strong> | کد ملی: {emp.nationalCode || '-'}
                                                    </p>
                                                </div>
                                                <div className="flex items-center gap-1 shrink-0">
                                                    <button onClick={() => handleResetEmpPassByAdmin(emp.id, emp.name)} className="text-[11px] bg-white border border-slate-200 hover:bg-indigo-50 text-indigo-600 font-bold px-2.5 py-1.5 rounded-lg">
                                                        تغییر رمز
                                                    </button>
                                                    <button onClick={() => handleDeleteEmployeeByAdmin(emp.id, emp.name)} className="p-1.5 text-rose-500 hover:bg-rose-100 rounded-lg">
                                                        <Icons.Trash />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* محتوای تب ۳ حسابداری: پشتیبان‌گیری و بازیابی اطلاعات */}
                                {currentUser.role === 'accountant' && profileTab === 'backup' && (
                                    <div className="space-y-4">
                                        <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                                            <h4 className="text-xs font-extrabold text-slate-800 mb-1">دانلود فایل پشتیبان (Backup)</h4>
                                            <p className="text-xs text-slate-500 mb-3">تمامی درخواست‌ها، رسیدها و لیست کارمندان را در یک فایل ذخیره کنید.</p>
                                            <button onClick={handleDownloadBackup} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2">
                                                <Icons.Download />
                                                <span>دانلود فایل پشتیبان</span>
                                            </button>
                                        </div>

                                        <div className="p-4 rounded-2xl bg-emerald-50/50 border border-emerald-200">
                                            <h4 className="text-xs font-extrabold text-emerald-900 mb-1">بازگردانی اطلاعات (Restore)</h4>
                                            <p className="text-xs text-emerald-700 mb-3">اگر قبلاً فایل پشتیبان گرفته‌اید، برای بازگردانی آن را انتخاب کنید:</p>
                                            <label className="w-full bg-white border border-emerald-300 hover:bg-emerald-50 text-emerald-700 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 cursor-pointer">
                                                <Icons.Upload />
                                                <span>انتخاب فایل پشتیبان (.json)</span>
                                                <input type="file" accept=".json" onChange={handleRestoreBackup} className="hidden" />
                                            </label>
                                        </div>
                                    </div>
                                )}

                                {/* فوتر مودال: دکمه خروج کامل از حساب کاربری */}
                                <div className="mt-6 pt-4 border-t border-slate-200 flex items-center justify-between gap-3">
                                    <button 
                                        type="button"
                                        onClick={() => { setShowProfileModal(false); setCurrentUser(null); setSelectedReq(null); }}
                                        className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-rose-600/20 transition"
                                    >
                                        <Icons.Logout />
                                        <span>خروج از این حساب کاربری (تعویض کاربر)</span>
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setShowProfileModal(false)} 
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-5 py-3 rounded-xl text-xs transition"
                                    >
                                        بستن
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* مودال بزرگنمایی عکس رسید */}
                    {previewModalImg && (
                        <div onClick={() => setPreviewModalImg(null)} className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="max-w-xl w-full bg-white p-3 rounded-3xl shadow-2xl animate-fade">
                                <img src={previewModalImg} alt="رسید بزرگ" className="w-full max-h-[80vh] object-contain rounded-2xl" />
                                <button onClick={() => setPreviewModalImg(null)} className="mt-3 w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm">
                                    بستن تصویر
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
